name: Gold ORB tick

# Runs the Asian-session gold ORB strategy (see README.md) every 5 minutes
# through a window that generously covers 17:30-07:30 America/New_York in
# both EDT and EST (the strategy's own session-anchor math is DST-correct
# regardless; this just makes sure the workflow itself keeps firing across
# the DST boundary without needing manual updates twice a year).
on:
  schedule:
    - cron: "*/5 20-23 * * *"
    - cron: "*/5 0-12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-orb-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-gold.txt

      - run: pip install -r requirements-gold.txt

      - name: Run gold-tick
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
        run: python main.py gold-tick

      - name: Render status report
        run: python scripts/render_gold_report.py

      - name: Commit updated engine state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold_state.json data/gold_webull_state.json GOLD_REPORT.md
          git diff --cached --quiet || git commit -m "Gold ORB tick: update engine state [skip ci]"
          git push
